name: Daily EEI Calculation & Phase Tracking Pipeline

on:
  schedule:
    # 每天 UTC 时间 00:00 (北京时间 08:00) 自动触发运行
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持在 GitHub 网页端手动一键触发运行

jobs:
  run-eei-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies & EEI Package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Daily EEI Automated Pipeline
        env:
          # 如需连接 OpenXLab 或外部金融/社媒 API，可在 Repo Secrets 中设置
          OPENXLAB_TOKEN: ${{ secrets.OPENXLAB_TOKEN }}
          FINANCIAL_DATA_API_KEY: ${{ secrets.FINANCIAL_DATA_API_KEY }}
        run: |
          python scripts/daily_runner.py

      - name: Commit and Push Updated Results & Daily Logs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/eei_latest_metrics.json data/eei_history_series.csv data/daily_log.md
          
          # 仅在有文件变动时提交
          git diff-index --quiet HEAD || git commit -m "auto: update daily EEI calculation metrics and phase log [skip ci]"
          git push
